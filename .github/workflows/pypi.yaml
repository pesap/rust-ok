name: Publish to PyPI
on:
  workflow_run:
    workflows: ["release-please"]
    types: [completed]

jobs:
  package:
    name: Package to publish
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fetch tags and detect release tag
        id: tag
        run: |
          git fetch --force --tags
          TAG=$(git tag --points-at ${{ github.event.workflow_run.head_sha }} | head -n 1)
          if [ -n "$TAG" ]; then
            echo "Found tag $TAG"
            git checkout "$TAG"
          else
            echo "No release tag on ${{ github.event.workflow_run.head_sha }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: ${{ steps.tag.outputs.tag != '' }}
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        if: ${{ steps.tag.outputs.tag != '' }}
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        if: ${{ steps.tag.outputs.tag != '' }}
        run: uv sync --all-groups

      - name: Build package
        if: ${{ steps.tag.outputs.tag != '' }}
        run: uv build

      - name: Store the distribution packages
        if: ${{ steps.tag.outputs.tag != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: package
    if: ${{ needs.package.outputs.tag != '' }}
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rust-ok
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs:
      - package
      - publish-testpypi
    if: ${{ needs.package.outputs.tag != '' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rust-ok
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
